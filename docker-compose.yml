services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.32.6
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - GENERIC_TIMEZONE=Asia/Bangkok
      - TZ=Asia/Bangkok
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_WEBHOOK_URL=https://${NGROK_DOMAIN}/
      - N8N_PROXY_HOPS=1
      - N8N_UNVERIFIED_PACKAGES_ENABLED=false
      - N8N_RUNNERS_TASK_TIMEOUT=300
      - N8N_COMPRESSION_NODE_MAX_DECOMPRESSED_SIZE_BYTES=2147483648
      - N8N_COMPRESSION_NODE_MAX_ZIP_ENTRIES=5000
    volumes:
      - n8n_data:/home/node/.n8n

  ngrok:
    image: ngrok/ngrok:latest
    restart: unless-stopped
    command: http n8n:5678 --url https://${NGROK_DOMAIN}
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    depends_on:
      - n8n

  # แปลงหน้า HTML เป็น PDF ให้ Workflow R (รายงานรายเดือน) · ฟรี ไม่ต้องมี API key
  # ไม่เปิด port ออกนอกเครื่อง n8n เรียกผ่านเครือข่ายภายในที่ http://gotenberg:3000
  # มีฟอนต์ไทย (Noto Sans Thai) มาในตัวแล้ว
  gotenberg:
    image: gotenberg/gotenberg:8.40.0
    restart: unless-stopped
    command: gotenberg --api-timeout=60s --chromium-auto-start --libreoffice-disable-routes

volumes:
  n8n_data:
